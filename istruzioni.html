<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><title>Aracoeli 20 · Come entrare</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --dark:#203050; --dark2:#34436B; --ocra:#B06E27; --grano:#CD9A48; --blu:#3A5A6E;
  --cream:#F6F1E8; --card:#ffffff; --ink:#26303f; --muted:#6b7585; --line:#e7ddcd;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Jost',system-ui,sans-serif; color:var(--ink); background:var(--cream);
  line-height:1.55; -webkit-text-size-adjust:100%;
}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
/* Header */
.hero{background:linear-gradient(160deg,var(--dark),var(--dark2));color:#fff;padding:26px 16px 22px;text-align:center}
.hero img{width:92px;height:auto;display:block;margin:0 auto 6px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3))}
.hero h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:30px;margin:2px 0 2px;letter-spacing:.5px}
.hero .sub{font-size:13px;letter-spacing:2px;text-transform:uppercase;opacity:.85;font-weight:300}
.welcome{font-family:'Cormorant Garamond',serif;font-size:21px;color:var(--dark);text-align:center;margin:18px 4px 6px;font-weight:600}
.lead{text-align:center;color:var(--muted);font-size:14.5px;margin:0 6px 18px}
/* Step card */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;margin:14px 0;box-shadow:0 3px 10px rgba(32,48,80,.05)}
.step{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.badge{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--ocra);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;font-size:15px}
.step h2{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:21px;color:var(--dark);margin:0}
.card p{margin:6px 0 0;font-size:15px}
.card .hint{color:var(--muted);font-size:13.5px;margin-top:6px}
.photo{display:block;width:100%;height:auto;border-radius:12px;margin-top:10px;border:1px solid var(--line)}
.photo+.photo{margin-top:8px}
.key{display:inline-block;background:#f3ebdd;color:var(--ocra);border:1px solid var(--grano);border-radius:8px;padding:1px 8px;font-weight:600;font-size:13px}
/* Extra blocks */
.extra h2{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:21px;color:var(--dark);margin:0 0 4px;display:flex;align-items:center;gap:8px}
.extra .ico{font-size:20px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--dark);color:#fff;text-decoration:none;font-weight:500;font-size:15px;padding:13px 14px;border-radius:12px;margin-top:10px}
.btn.ocra{background:var(--ocra)}
.btn.line{background:#fff;color:var(--dark);border:1.5px solid var(--dark)}
.note{background:#fbf6ec;border-left:4px solid var(--grano);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:13.5px;color:#6a5a3c}
.wifi{background:linear-gradient(160deg,var(--blu),#2c4654);color:#fff;text-align:center}
.wifi h2{color:#fff;justify-content:center}
.wifi .pw{font-family:'Jost';font-weight:600;font-size:24px;letter-spacing:1px;background:rgba(255,255,255,.14);border-radius:10px;padding:8px 14px;display:inline-block;margin-top:6px;user-select:all}
.foot{text-align:center;margin-top:26px;color:var(--muted);font-size:13px}
.foot a{color:var(--dark);font-weight:500}
.wa{display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#fff;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:30px;margin:6px 0 14px}
.sep{height:1px;background:var(--line);margin:20px 0}

</style></head>
